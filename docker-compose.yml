services:
  frontend:
    build:
      context: frontend
    env_file:
      - frontend/.env
    volumes:
      - frontend:/app/frontend/dist

  mongo:
    image: mongo
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
    volumes:
      - db:/data/db
    ports:
      - 27018:27017
    networks:
      - internal

  backend:
    restart: always
    build:
      context: backend
    environment:
      PORT: 3000
      DB_ADDRESS: mongodb://root:example@mongo:27017/weblarek?authSource=admin
      ORIGIN_ALLOW: http://localhost,http://localhost:5173
      JWT_SECRET: dev-jwt-secret
      AUTH_ACCESS_TOKEN_SECRET: dev-access-token-secret
      AUTH_REFRESH_TOKEN_SECRET: dev-refresh-token-secret
      AUTH_ACCESS_TOKEN_EXPIRY: 10m
      AUTH_REFRESH_TOKEN_EXPIRY: 7d
    volumes:
      - ./backend/src:/app/src
      - public:/app/src/public
    expose:
      - 3000
    networks:
      - internal
    depends_on:
      - mongo

  server:
    build:
      context: nginx
    ports:
      - 80:80
    volumes:
      - frontend:/var/app
      - public:/var/public
    depends_on:
      - frontend
      - backend
    networks:
      - internal

volumes:
  frontend:
  public:
  db:

networks:
  internal:
